name: Upstream sync

# Once a day, checks for a new stable herdr release (herdrdev/herdr). When multiplayer-cursors
# doesn't include it yet, merges the release, runs the tests on the merge, and opens a pull
# request from sync/<tag>. When the merge conflicts or can't be pushed, opens an issue with the
# commands to merge it by hand instead. Each release is reported once; close the pull request or
# issue to skip a release.
#
# Most upstream releases change .github/workflows, and GitHub only lets a token with the
# Workflows permission push such commits; the built-in GITHUB_TOKEN never has it. To get pull
# requests for those releases too, store a fine-grained token for this repository with Contents
# and Workflows set to read and write as the UPSTREAM_SYNC_TOKEN secret. It is only used to push
# the sync branch.

on:
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream tag or branch to merge instead of the latest release (always reports)
        required: false
        default: ""
      dry_run:
        description: Only print what would be pushed and opened
        type: boolean
        default: false

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM_REPO: herdrdev/herdr
  BASE_BRANCH: multiplayer-cursors
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  # Read-only: upstream's build scripts and tests run here, away from any write token.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      ref: ${{ steps.target.outputs.ref }}
      target: ${{ steps.target.outputs.target }}
      base: ${{ steps.target.outputs.base }}
      state: ${{ steps.merge.outputs.state || steps.target.outputs.state }}
      tests: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Find the upstream release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ref="${REQUESTED:-$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq .tag_name)}"
          if ! [[ "$ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "::error::unexpected upstream ref name: $ref"
            exit 1
          fi
          git fetch --quiet --no-tags "https://github.com/$UPSTREAM_REPO.git" "$ref"
          target="$(git rev-parse 'FETCH_HEAD^{commit}')"
          base="$(git rev-parse HEAD)"
          if git merge-base --is-ancestor "$target" "$base"; then
            state=current
            echo "$BASE_BRANCH already includes upstream $ref"
          elif [ -z "$REQUESTED" ] && {
              [ "$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --head "sync/$ref" --json number --jq length)" != 0 ] ||
              [ "$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 500 --json title \
                    --jq "map(select(.title == \"Merge upstream herdr $ref\")) | length")" != 0 ]
            }; then
            state=reported
            echo "upstream $ref was already reported"
          else
            state=new
            echo "upstream $ref ($target) is not in $BASE_BRANCH yet"
          fi
          {
            echo "ref=$ref"
            echo "target=$target"
            echo "base=$base"
            echo "state=$state"
          } >> "$GITHUB_OUTPUT"

      - name: Merge
        id: merge
        if: steps.target.outputs.state == 'new'
        env:
          REF: ${{ steps.target.outputs.ref }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail
          if git merge --quiet --no-ff -m "chore: merge upstream herdr $REF" "$TARGET"; then
            echo "state=clean" >> "$GITHUB_OUTPUT"
          else
            echo "conflicts:"
            git diff --name-only --diff-filter=U
            git merge --abort
            echo "state=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Read toolchain versions
        id: toolchain
        if: steps.merge.outputs.state == 'clean'
        run: .github/scripts/fork-toolchain-versions.sh >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: steps.merge.outputs.state == 'clean'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.rust }}

      - name: Install Zig
        if: steps.merge.outputs.state == 'clean'
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: ${{ steps.toolchain.outputs.zig }}

      - name: Install cargo-nextest
        if: steps.merge.outputs.state == 'clean'
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest

      - name: Test the merge
        id: tests
        if: steps.merge.outputs.state == 'clean'
        continue-on-error: true
        run: cargo nextest run --locked --status-level fail --final-status-level slow --failure-output final --success-output never

  # Pushes sync/<tag> and opens the pull request or issue.
  publish:
    needs: check
    if: needs.check.outputs.state == 'clean' || needs.check.outputs.state == 'conflict'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.check.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - name: Open a pull request or issue
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          HAS_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
          REF: ${{ needs.check.outputs.ref }}
          TARGET: ${{ needs.check.outputs.target }}
          BASE: ${{ needs.check.outputs.base }}
          STATE: ${{ needs.check.outputs.state }}
          TESTS: ${{ needs.check.outputs.tests }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          upstream="https://github.com/$UPSTREAM_REPO"
          branch="sync/$REF"
          git fetch --quiet --no-tags "$upstream.git" '+refs/tags/v*:refs/tags/v*'
          git fetch --quiet --no-tags "$upstream.git" "$REF"
          if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$TARGET" ]; then
            echo "::error::upstream $REF moved since the check job; rerun the workflow"
            exit 1
          fi

          if [[ "$REF" =~ ^v[0-9] ]]; then
            what="[herdr $REF]($upstream/releases/tag/$REF)"
          else
            what="[herdr $REF]($upstream/tree/$REF)"
          fi
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$BASE" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            what="$what ([changes since $previous]($upstream/compare/$previous...$REF))"
          fi
          bullets() { awk 'NR <= 60 { print "- `" $0 "`" } END { if (NR > 60) print "- and " NR - 60 " more" }'; }
          merge_base="$(git merge-base "$BASE" "$TARGET")"
          both="$(comm -12 <(git diff --name-only "$merge_base" "$TARGET" | sort) \
                           <(git diff --name-only "${previous:-$merge_base}" "$BASE" | sort))"
          case "$TESTS" in
            success) tests="Tests passed on the merge ([run]($RUN_URL))." ;;
            failure) tests="**Tests failed on the merge** ([run]($RUN_URL))." ;;
            *)       tests="Tests didn't run ([run]($RUN_URL))." ;;
          esac
          by_hand="Merge it by hand:

          \`\`\`bash
          git switch $BASE_BRANCH && git pull
          git fetch --no-tags $upstream.git $REF
          git merge --no-ff FETCH_HEAD -m \"chore: merge upstream herdr $REF\"
          # resolve any conflicts, then: git add <files> && git commit --no-edit
          git push
          \`\`\`

          Then update the version in the README's first line, and close this issue once it's pushed."

          if [ "$STATE" = conflict ]; then
            git merge --quiet --no-ff --no-commit "$TARGET" >/dev/null 2>&1 || true
            conflicts="$(git diff --name-only --diff-filter=U | bullets)"
            git merge --abort
            kind=issue
            body="Upstream released $what. Merging it into \`$BASE_BRANCH\` conflicts in:

          $conflicts

          $by_hand"
          else
            git merge --quiet --no-ff -m "chore: merge upstream herdr $REF" "$TARGET"
            if [[ "$REF" =~ ^v[0-9] ]]; then
              sed -i -E "s#^(A modified fork of \[herdr\]\(https://github.com/herdrdev/herdr\)) v[0-9][^ ]*#\1 $REF#" README.md
              git diff --quiet || git commit --quiet -am "docs: note the fork is based on herdr $REF"
            fi
            overlap=""
            if [ -n "$both" ]; then
              overlap="Files changed both upstream and in the fork, worth a look:

          $(printf '%s\n' "$both" | bullets)"
            fi
            workflow_changes="$(git log --format= --name-only "$BASE..HEAD" -- .github/workflows | sort -u)"
            if [ "$HAS_SYNC_TOKEN" != true ] && [ -n "$workflow_changes" ]; then
              kind=issue
              why="This release changes \`.github/workflows\`, and GitHub only lets a token with the Workflows permission push such commits, so this workflow can't push the merge for a pull request. Add an \`UPSTREAM_SYNC_TOKEN\` secret (see \`.github/workflows/upstream-sync.yml\`) to get pull requests for releases like this."
            else
              auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
              echo "::add-mask::$auth"
              push=(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --force)
              if [ "$DRY_RUN" = true ]; then push+=(--dry-run); fi
              push+=("https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch")
              if push_output="$("${push[@]}" 2>&1)"; then
                kind=pr
              else
                kind=issue
                why="Pushing \`$branch\` for a pull request failed:

          \`\`\`
          $(printf '%s\n' "$push_output" | sed '/[Aa]uthorization/d' | tail -n 5)
          \`\`\`"
              fi
            fi
            if [ "$kind" = pr ]; then
              body="Merges upstream $what into \`$BASE_BRANCH\`.

          $tests

          $overlap

          Merge this with **Create a merge commit**. Squash or rebase merging drops upstream's history, and the next sync would conflict. Once merged, the fork builds are rebuilt and \`herdr update\` installs them."
            else
              body="Upstream released $what. It merges into \`$BASE_BRANCH\` without conflicts. $why

          $tests

          $overlap

          $by_hand"
            fi
          fi

          body="$(printf '%s\n' "$body" | cat -s)"
          title="Merge upstream herdr $REF"
          if [ "$DRY_RUN" = true ]; then
            echo "dry run: would open this $kind"
            if [ "$kind" = issue ]; then echo "title: $title"; fi
            printf '%s\n' "$body"
          elif [ "$kind" = pr ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$branch" \
              --title "chore: merge upstream herdr $REF" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Mark the run failed when the merge's tests failed
        if: needs.check.outputs.tests == 'failure'
        run: exit 1
